git:
  autoFetch: false
gui:
  screenMode: "half"
keybinding:
  universal:
    nextScreenMode: "<f1>"
customCommands:
  - key: "<f2>"
    description: "Git workflow shortcuts"
    commandMenu:
      - key: "m"
        context: "global"
        description: "Update master from origin"
        command: "git fetch origin master:master"
      - key: "b"
        context: "global"
        description: "Create branch from master"
        prompts:
          - type: "input"
            title: "New branch name:"
            key: "BranchName"
        command: "git branch {{.Form.BranchName | quote}} master"
      - key: "n"
        context: "global"
        description: "Create branch from master and checkout"
        prompts:
          - type: "input"
            title: "New branch name:"
            key: "BranchName"
        command: "git checkout master -b {{.Form.BranchName}}"
      - key: "f"
        context: "global"
        description: "Fetch master + create branch from master + checkout"
        prompts:
          - type: "input"
            title: "New branch name:"
            key: "BranchName"
        command: "git fetch origin master:master && git checkout master -b {{.Form.BranchName}}"
      - key: "c"
        context: "subCommits"
        description: "Cherry-pick with -x flag"
        command: "git cherry-pick -x {{ .SelectedCommit.Sha }}"
        loadingText: "Cherry-picking ..."
        # output: terminal
      - key: "C"
        context: "subCommits"
        description: "Cherry-pick merge commit (-m 1)"
        prompts:
          - type: "input"
            title: "Parent number (usually 1):"
            initialValue: "1"
            key: "ParentNumber"
        command: "git cherry-pick -m {{.Form.ParentNumber}} {{.SelectedCommit.Sha}}"
